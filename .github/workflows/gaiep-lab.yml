name: GAIEP-LAB

on:
  push:
    branches:
      - lab/runtime-vnext
  pull_request:
    branches:
      - lab/runtime-vnext

jobs:
  static-verification:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GAIEP-LAB
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install development tools
        run: python -m pip install --upgrade pip pytest==8.3.5 ruff==0.16.1 pyright==1.1.411

      - name: Ruff
        run: ruff check .

      - name: Pyright
        run: pyright

      - name: Pytest
        run: pytest -q
