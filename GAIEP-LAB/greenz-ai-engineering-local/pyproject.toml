[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gaiep-engineering-lab"
version = "0.1.0"
description = "Local GAIEP agent/runtime contract lab snapshot"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "pyright>=1.1",
]

[tool.pytest.ini_options]
testpaths = [
    "tests/test_agent_runtime_contracts.py",
    "tests/test_context_engine_contracts.py",
    "tests/test_hermes_openhands_baseline_contracts.py",
    "tests/test_runtime_vnext_execution_contracts.py",
    "tests/test_runtime_vnext_integration_hardening.py",
    "tests/test_capability_mcp_gateway_contracts.py",
    "tests/test_context_skills_integration_contracts.py",
    "self_improvement/test_provenance.py",
    "tests/test_vertical_runtime_provenance_integration.py",
]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.pyright]
include = [
    "runtime",
    "tests/test_agent_runtime_contracts.py",
    "tests/test_context_engine_contracts.py",
    "tests/test_hermes_openhands_baseline_contracts.py",
    "tests/test_runtime_vnext_execution_contracts.py",
    "tests/test_runtime_vnext_integration_hardening.py",
    "tests/test_capability_mcp_gateway_contracts.py",
    "tests/test_context_skills_integration_contracts.py",
]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingTypeStubs = false

[tool.setuptools.packages.find]
include = ["runtime*", "self_improvement*"]
exclude = ["tests*"]
