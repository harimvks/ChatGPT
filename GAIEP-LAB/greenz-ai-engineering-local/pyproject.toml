[project]
name = "gaiep-engineering-lab"
version = "0.1.0"
description = "Local GAIEP agent/runtime contract lab snapshot"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "pyright>=1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests/test_agent_runtime_contracts.py"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.pyright]
include = [
    "runtime",
    "tests/test_agent_runtime_contracts.py",
]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
